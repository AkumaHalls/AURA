{% from "modulo_form.html" import campo_canal, campo_cargo, campo_numero, acao_validar, ajuda_placeholders, salvar with context %}

{% set ct = cfg.contador %}

<form method="post" action="{{ url_for('salvar_generico', modulo='contador', guild=guild.id) }}">
  <div class="card-aura card mb-4">
    <div class="card-header fw-semibold">
      <div class="form-check form-switch d-inline-block me-2">
        <input class="form-check-input" type="checkbox" name="enabled" id="ct_on"
               {{ 'checked' if ct.enabled }}>
      </div>
      <label class="form-check-label fw-semibold mb-0" for="ct_on">Contador de membros</label>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">{{ campo_canal('channel_id', 'Canal do contador', ct.channel_id,
          'O nome do canal vira o contador.') }}</div>
        <div class="col-md-6">
          <label class="form-label" for="channel_name">Nome do canal</label>
          <input class="form-control" name="channel_name" id="channel_name"
                 value="{{ ct.channel_name }}">
          <div class="form-text placeholder-doc">Use <code>{count}</code> para o número.</div>
        </div>
        <div class="col-12">
          <label class="form-label" for="category_name">Categoria</label>
          <input class="form-control" name="category_name" id="category_name"
                 value="{{ ct.category_name }}">
        </div>
      </div>
    </div>
  </div>

  <button class="btn btn-aura px-4">
    <i class="bi bi-check2 me-1"></i>Salvar contador
  </button>
</form>
