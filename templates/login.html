<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Admin - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f1117; display: flex; align-items: center; min-height: 100vh; }
        .login-card { background: #1a1d23; border: 1px solid #2d3139; border-radius: 16px; padding: 2.5rem; max-width: 400px; width: 100%; }
        .login-card h3 { color: #e1e3e6; }
        .form-control { background: #0f1117; border: 1px solid #2d3139; color: #e1e3e6; }
        .form-control:focus { background: #0f1117; border-color: #4ade80; box-shadow: 0 0 0 2px rgba(74,222,128,.15); color: #e1e3e6; }
        .btn-success { background: #166534; border: none; }
        .btn-success:hover { background: #15803d; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="login-card">
            <div class="text-center mb-4">
                <i class="bi bi-fox" style="font-size:3rem;color:#4ade80;"></i>
                <h3 class="mt-2">Aura Admin</h3>
                <p style="color:#6b7280;">Insira a senha para acessar</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Senha" required autofocus>
                </div>
                <button type="submit" class="btn btn-success w-100">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
