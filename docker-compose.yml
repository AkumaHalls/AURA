# AURA · bot + painel web
#
# Subir com:  docker compose up -d --build
# O painel fica em http://SEU_IP:2501
#
# O banco NÃO é um serviço deste arquivo: `secrets.env` traz a MONGO_URI
# apontando para o Mongo que você já tem (em outro stack, ou gerenciado).
# Isso mantém o bot independente do banco, que é o que a VPS usa hoje.
#
# `secrets.env` NÃO é versionado. Ele é lido pelo Compose para preencher as
# variáveis abaixo e NÃO é copiado para dentro da imagem.

services:
  bot:
    build: .
    image: aura-bot-bot:latest
    container_name: aura-bot
    restart: unless-stopped
    ports:
      # 127.0.0.1 = painel só acessível por SSH/Proxy.
      # Troque para "2501:2501" se quiser expor direto, como a VPS expõe.
      - "0.0.0.0:2501:2501"
    env_file:
      - secrets.env
    environment:
      TZ: America/Sao_Paulo
      WEB_PANEL_HOST: 0.0.0.0
      WEB_PANEL_PORT: "2501"
      MONGO_DB_NAME: ${MONGO_DB_NAME:-aura_bot}