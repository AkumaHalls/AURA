services:
  mongodb:
    image: mongo:7-jammy
    container_name: aura-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-wytrom}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-protecao9650senha}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: aura-bot
    restart: unless-stopped
    ports:
      - "2501:2501"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # Discord
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DONO_ID=${DONO_ID}
      - OWNER_ID=${OWNER_ID}
      - TEST_GUILD_ID=${TEST_GUILD_ID}

      # Clash of Clans API
      - COC_EMAIL=${COC_EMAIL}
      - COC_PASSWORD=${COC_PASSWORD}
      - CLAN_TAG=${CLAN_TAG}

      # MongoDB / Web Panel
      - MONGO_URI=${MONGO_URI:-mongodb://wytrom:protecao9650senha@mongodb:27017/?authSource=admin}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-aura_bot}
      - WEB_PANEL_PASSWORD=${WEB_PANEL_PASSWORD}

      # Atendimento (IDs Discord)
      - id_cargo_atendente=${id_cargo_atendente}
      - id_canal_suporte=${id_canal_suporte}
      - id_categoria_staff=${id_categoria_staff}
      - id_servidor_bh=${id_servidor_bh}
      - id_canal_logs_bh=${id_canal_logs_bh}
      - id_canal_avaliacao=${id_canal_avaliacao}
      - id_servidor_tribunal=${id_servidor_tribunal}
      - id_canal_logs_tri=${id_canal_logs_tri}
      - ID_CANAL_TRANSCRICOES=${ID_CANAL_TRANSCRICOES}

      # Autorole
      - CANAL_REGISTRO_ID=${CANAL_REGISTRO_ID}
      - CARGO_MEMBRO_ID=${CARGO_MEMBRO_ID}
      - CARGO_BANIDO_ID=${CARGO_BANIDO_ID}

      # ClashLog Manager (registro, cargos, etc.)
      - REGISTRATION_CHANNEL_ID=${REGISTRATION_CHANNEL_ID}
      - LOG_CHANNEL_ID=${LOG_CHANNEL_ID}
      - APPROVAL_LOG_CHANNEL_ID=${APPROVAL_LOG_CHANNEL_ID}
      - COC_MEMBER_ROLE_ID=${COC_MEMBER_ROLE_ID}
      - COC_ELDER_ROLE_ID=${COC_ELDER_ROLE_ID}
      - COC_COLEADER_ROLE_ID=${COC_COLEADER_ROLE_ID}
      - KICK_MESSAGE=${KICK_MESSAGE}

      - TZ=America/Sao_Paulo

volumes:
  mongo_data:
